name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # "Run workflow" button for manual runs

# Actions are pinned to commit SHAs (tags can be moved or deleted); the comment shows the version.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, test, audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0   # full history for the secret scan

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.lock

      - name: Install locked dependencies
        run: |
          pip install --require-hashes -r requirements.lock
          pip install --require-hashes -r requirements-dev.lock

      - name: Lint
        run: ruff check .

      - name: Unit and end-to-end tests
        env:
          LLM_PROVIDER: none
        run: python -m pytest -q

      - name: Audit dependencies for known vulnerabilities
        run: pip-audit --strict -r requirements.lock

  image:
    name: Build and scan image
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Run tests inside the image
        run: |
          docker build --target test -t solr-sentinel-test .
          docker run --rm -e LLM_PROVIDER=none solr-sentinel-test

      - name: Build production image
        run: docker build --target production -t solr-sentinel:${{ github.sha }} .

      - name: Check the image runs as non-root
        run: test "$(docker run --rm --entrypoint id solr-sentinel:${{ github.sha }} -u)" != "0"

      - name: Refuse unsafe production settings
        run: |
          if docker run --rm -e SENTINEL_ENV=production solr-sentinel:${{ github.sha }} \
               python -c "from app.main import create_app; create_app(start_background=False)"; then
            echo "production mode started without an API key"; exit 1
          fi

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: solr-sentinel:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
